<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HQ</title>
<style>
  :root {
    --bg1: #0f1115; --bg2: #171a21; --bg3: #1f232c;
    --text1: #f2f3f5; --text2: #b8bcc4; --text3: #7c8190;
    --border1: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.12);
    --blue: #4f8cff; --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg1); color: var(--text1);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    padding-bottom: 72px;
  }
  header {
    padding: 20px 16px 12px; position: sticky; top: 0; background: var(--bg1); z-index: 10;
  }
  header h1 { font-size: 20px; margin: 0 0 2px; }
  header .updated { font-size: 12px; color: var(--text3); }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--bg2); border-top: 1px solid var(--border1); z-index: 20;
  }
  .tabbar button {
    flex: 1; padding: 14px 0; background: none; border: none; color: var(--text3);
    font-size: 13px; cursor: pointer;
  }
  .tabbar button.active { color: var(--blue); font-weight: 600; }

  .tab-content { display: none; padding: 0 16px; }
  .tab-content.active { display: block; }

  .card {
    background: var(--bg2); border: 1px solid var(--border1); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--text2); }

  .quick-nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .quick-nav a {
    display: block; background: var(--bg3); border-radius: var(--radius-sm);
    padding: 12px; color: var(--text1); text-decoration: none; font-size: 13px; text-align: center;
  }

  .summary-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .summary-pill {
    background: var(--bg3); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--text2);
  }
  .summary-pill b { color: var(--text1); }

  .search-box {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .search-box input {
    flex: 1; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); color: var(--text1); font-size: 14px; outline: none;
  }

  .result-item {
    padding: 10px 4px; border-bottom: 1px solid var(--border1); font-size: 13px;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item .name { color: var(--text1); }
  .result-item .meta { color: var(--text3); font-size: 11px; margin-top: 2px; }
  .result-item a { color: var(--blue); text-decoration: none; }
  .label-edit-btn {
    margin-top: 6px; padding: 4px 10px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 999px; color: var(--text2); font-size: 11px; cursor: pointer;
  }

  .gist-section input {
    width: 100%; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); color: var(--text1); font-size: 13px; outline: none; margin-bottom: 8px;
  }
  .gist-section button, .btn {
    padding: 10px 16px; background: var(--blue); border: none; border-radius: var(--radius-sm);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .form-label { font-size: 12px; color: var(--text3); margin-bottom: 4px; display: block; }
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    padding: 10px 16px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .empty { color: var(--text3); font-size: 13px; padding: 12px 0; text-align: center; }

  #tab-map2.tab-content { padding: 0; }
  .map-frame {
    width: 100%;
    height: calc(100vh - 76px);
    border: none;
    display: block;
  }

  .goal-group-title {
    font-size: 12px; color: var(--text3); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .goal-group-title:first-child { margin-top: 0; }
  .goal-item {
    padding: 10px 0; border-bottom: 1px solid var(--border1);
  }
  .goal-item:last-child { border-bottom: none; }
  .goal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .goal-title { font-size: 13px; color: var(--text1); }
  .goal-period { font-size: 11px; color: var(--text3); margin-left: 6px; }
  .goal-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .goal-actions button {
    background: none; border: none; color: var(--text3); font-size: 13px; cursor: pointer; padding: 2px 4px;
  }
  .goal-progress-wrap { margin-top: 6px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .goal-progress-bar { flex: 1; height: 6px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
  .goal-progress-fill { height: 100%; background: var(--blue); border-radius: 999px; }
  .goal-progress-pct { font-size: 11px; color: var(--text3); width: 38px; text-align: right; }
  .goal-check {
    margin-top: 6px; font-size: 12px; color: var(--text2); cursor: pointer; user-select: none;
  }
  .goal-check.done { color: var(--blue); }

  .goal-form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .goal-form-row select, .goal-form-row input {
    padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text1); font-size: 13px; outline: none;
  }
  .goal-form-row select { flex: 0 0 90px; }
  .goal-form-row input.goal-title-input { flex: 1; }
  .goal-form-row input.goal-num-input { flex: 1; min-width: 0; }

  .todo-row {
    display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; color: var(--text1);
  }
  .todo-row input[type="checkbox"] { flex-shrink: 0; width: 15px; height: 15px; accent-color: var(--blue); }
  .todo-grade {
    flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px;
    background: var(--bg3); color: var(--text2);
  }
  .todo-sub-title { font-size: 11px; color: var(--text3); margin-top: 6px; }
  .todo-sub-title:first-child { margin-top: 0; }
  .todo-note {
    font-size: 11px; color: var(--text3); margin: 0 0 4px 21px; white-space: pre-line; line-height: 1.4;
  }

  .home-goal-row { padding: 8px 0; border-bottom: 1px solid var(--border1); }
  .home-goal-row:last-child { border-bottom: none; }

  .goal-weekly-text { font-size: 13px; color: var(--text1); margin-top: 6px; }
  .goal-tiers { margin-top: 6px; }
  .goal-tier-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); padding: 2px 0; }
  .goal-tier-row span:first-child { color: var(--text3); }
  .goal-inactive-note { font-size: 12px; color: var(--text3); margin-top: 8px; }
  .goal-controls { display: flex; gap: 6px; margin-top: 8px; }
  .goal-controls button {
    padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 999px;
    color: var(--text1); font-size: 12px; cursor: pointer;
  }
  .goal-controls button.running { background: var(--blue); color: #fff; border-color: var(--blue); }
  .stopwatch-live { font-variant-numeric: tabular-nums; font-weight: 600; }

  .goal-form-row.goal-form-row-wide input { flex: 1; }

  .day-chip-group { display: flex; gap: 4px; flex-wrap: wrap; }
  .day-chip {
    padding: 6px 10px; border-radius: 999px; background: var(--bg3); border: 1px solid var(--border2);
    color: var(--text3); font-size: 12px; cursor: pointer; user-select: none;
  }
  .day-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .day-preset-btn {
    padding: 6px 10px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 999px;
    color: var(--text2); font-size: 11px; cursor: pointer;
  }
  #save-status { font-size: 12px; }

  /* 목표 달력(도장) */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head button {
    background: var(--bg3); border: 1px solid var(--border2); color: var(--text1);
    border-radius: 8px; padding: 4px 12px; font-size: 14px; cursor: pointer;
  }
  .cal-title { font-size: 15px; font-weight: 600; }
  .cal-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .cal-chip {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border2);
    color: var(--text2); cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 5px;
  }
  .cal-chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .cal-chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 30px; gap: 3px; }
  .cal-h { font-size: 11px; color: var(--text3); text-align: center; padding: 2px 0; }
  .cal-cell {
    background: var(--bg3); border-radius: 6px; min-height: 52px; padding: 3px; cursor: pointer;
    border: 1.5px solid transparent; display: flex; flex-direction: column; gap: 2px;
  }
  .cal-cell .d { font-size: 11px; color: var(--text2); }
  .cal-cell.today .d { color: var(--blue); font-weight: 600; }
  .cal-cell.sel { border-color: var(--blue); }
  .cal-cell.blank { background: transparent; cursor: default; }
  .cal-cell.off { background: transparent; border: 1px dashed var(--border1); }
  .stamps { display: flex; flex-wrap: wrap; gap: 2px; }
  .stamp {
    width: 17px; height: 17px; border-radius: 50%; border: 2px solid; display: inline-flex;
    align-items: center; justify-content: center; font-size: 11px; font-weight: 700; line-height: 1;
    transform: rotate(-8deg); flex-shrink: 0;
  }
  .cal-wk { font-size: 11px; color: var(--text3); display: flex; align-items: center; justify-content: center; }
  .cal-caption { font-size: 11px; color: var(--text3); margin-top: 8px; line-height: 1.5; }

  .rec-row { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border1); }
  .rec-row:last-child { border-bottom: none; }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .rec-main { flex: 1; min-width: 0; font-size: 13px; }
  .rec-note { font-size: 12px; color: var(--text3); margin-top: 2px; white-space: pre-line; word-break: break-word; }
  .rec-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .rec-form select, .rec-form input {
    padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text1); font-size: 13px; outline: none;
  }
  .rec-form-row { display: flex; gap: 8px; }

  /* 홈: 이번 주 도장판 */
  .wk-goal { padding: 8px 0; border-bottom: 1px solid var(--border1); }
  .wk-goal:last-child { border-bottom: none; }
  .wk-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 5px; }
  .wk-title { font-size: 13px; color: var(--text1); }
  .wk-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .wk-head { margin-bottom: 2px; }
  .wk-head span { font-size: 11px; color: var(--text3); text-align: center; }
  .wk-cell {
    background: var(--bg3); border-radius: 6px; height: 28px; display: flex; align-items: center;
    justify-content: center; border: 1.5px solid transparent; cursor: pointer;
  }
  .wk-cell.today { border-color: var(--blue); }
  .wk-cell.off { background: transparent; border: 1px dashed var(--border1); }
  .wk-quick {
    padding: 4px 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 999px;
    color: var(--text1); font-size: 12px; cursor: pointer;
  }
  .wk-quick.running { background: var(--blue); color: #fff; border-color: var(--blue); }
</style>
</head>
<body>

<header>
  <h1>HQ</h1>
  <div class="updated"><span id="updated-label">자료지도 불러오는 중...</span><span id="save-status"></span></div>
</header>

<div id="tab-home" class="tab-content active">
  <div class="card">
    <h2>오늘업무 · 주간업무</h2>
    <div id="home-todo"><div class="empty">불러오는 중...</div></div>
  </div>

  <div class="card">
    <h2>이번 주 도장</h2>
    <div id="home-goals"></div>
  </div>

  <div class="card">
    <h2>빠른 이동</h2>
    <div class="quick-nav">
      <a href="https://gjdnddd.github.io/todo-app/" target="_blank">할 일</a>
      <a href="https://gjdnddd.github.io/control-tower/" target="_blank">컨트롤타워</a>
      <a href="https://gjdnddd.github.io/invest-dashboard/" target="_blank">투자대시보드</a>
      <a href="https://gjdnddd.github.io/AIcollect/" target="_blank">통합정보</a>
    </div>
  </div>

</div>

<div id="tab-goals" class="tab-content">
  <div class="card">
    <div class="cal-head">
      <button onclick="calShift(-1)" aria-label="이전 달">‹</button>
      <span class="cal-title" id="cal-title"></span>
      <span style="display:flex; gap:6px;">
        <button onclick="calToday()">오늘</button>
        <button onclick="calShift(1)" aria-label="다음 달">›</button>
      </span>
    </div>
    <div class="cal-chips" id="cal-chips"></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-caption" id="cal-caption"></div>
  </div>

  <div class="card">
    <h2 id="day-title"></h2>
    <div id="day-records"></div>
    <div id="day-add"></div>
  </div>

  <div class="card">
    <h2>목표 현황</h2>
    <div id="goals-list"></div>
  </div>

  <div class="card">
    <h2>목표 추가</h2>
    <div class="goal-form-row goal-form-row-wide">
      <input type="text" id="goal-category" placeholder="분야 (예: 건강, 투자, 자기관리)" />
    </div>
    <div class="goal-form-row">
      <select id="goal-track-type">
        <option value="stopwatch" selected>스톱워치</option>
        <option value="counter">카운터</option>
      </select>
      <input type="text" id="goal-title" class="goal-title-input" placeholder="목표 제목 (예: 새벽집중)" />
    </div>
    <div class="goal-form-row" id="goal-days-row" style="flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="display:flex; gap:6px;">
        <button type="button" class="day-preset-btn" onclick="setActiveDaysPreset('all')">전체</button>
        <button type="button" class="day-preset-btn" onclick="setActiveDaysPreset('weekday')">평일만</button>
        <button type="button" class="day-preset-btn" onclick="setActiveDaysPreset('weekend')">주말만</button>
      </div>
      <div class="day-chip-group" id="goal-days-chips"></div>
    </div>
    <div class="goal-form-row">
      <input type="number" id="goal-target" class="goal-num-input" placeholder="하루 목표 수치 (선택)" />
      <input type="text" id="goal-unit" class="goal-num-input" placeholder="단위 (예: 시간, 세트, 종목)" />
    </div>
    <button class="btn" onclick="addGoal()">목표 추가 후 Gist에 저장</button>
  </div>
</div>

<div id="tab-map" class="tab-content">
  <div class="card">
    <h2>자료지도 요약</h2>
    <div class="summary-row" id="home-summary">
      <span class="summary-pill">불러오는 중...</span>
    </div>
  </div>

  <div class="card">
    <h2>자주 쓰는 자료</h2>
    <div id="pinned-list"></div>
  </div>

  <div class="card">
    <h2>자료지도 검색</h2>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="키워드로 검색 (예: 세금, 컨트롤타워)" />
    </div>
    <div id="search-results"></div>
  </div>

  <div class="card">
    <h2>자료 수동 등록</h2>
    <label class="form-label">이름</label>
    <input type="text" id="manual-name" placeholder="예: 2026 연말정산 자료" style="width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text1);font-size:13px;margin-bottom:8px;" />
    <label class="form-label">경로 또는 URL</label>
    <input type="text" id="manual-path" placeholder="폴더 경로 또는 웹 URL" style="width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text1);font-size:13px;margin-bottom:8px;" />
    <label class="form-label">키워드 (쉼표로 구분)</label>
    <input type="text" id="manual-keywords" placeholder="세금, 연말정산" style="width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text1);font-size:13px;margin-bottom:8px;" />
    <button class="btn" onclick="addManualItem()">추가 후 Gist에 저장</button>
  </div>

  <div class="card gist-section">
    <h2>Gist 연동</h2>
    <label class="form-label">Personal Access Token</label>
    <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx" />
    <label class="form-label">Gist ID</label>
    <input type="text" id="gist-id-input" placeholder="adff7f6a437517b81a7186f3bce352c8" />
    <button onclick="saveGistConfig()">설정 저장</button>
    <button onclick="syncGist()" style="margin-left:8px;background:var(--bg3);color:var(--text1);">지금 불러오기</button>
  </div>
</div>

<div id="tab-map2" class="tab-content">
  <iframe class="map-frame" src="https://gjdnddd.github.io/react-workflow-map/" title="워크플로우 맵" loading="lazy"></iframe>
</div>

<div class="tabbar">
  <button class="active" data-tab="home" onclick="switchTab('home')">홈</button>
  <button data-tab="goals" onclick="switchTab('goals')">목표</button>
  <button data-tab="map" onclick="switchTab('map')">자료지도</button>
  <button data-tab="map2" onclick="switchTab('map2')">맵</button>
</div>

<div class="toast" id="toast"></div>

<script>
const GIST_FILENAME = 'hq_scan_result.json';
const GOALS_FILENAME = 'hq_goals.json';
const DEFAULT_GIST_ID = 'adff7f6a437517b81a7186f3bce352c8';

// 봇 차단용 저민감도 키 (todo-app index.html에도 동일하게 하드코딩되어 있음 — 처리지침 문서 참고)
const TODO_READ_URL = 'https://asia-northeast3-infin-stock-bot.cloudfunctions.net/todo-inbox-read';
const TODO_WRITE_URL = 'https://asia-northeast3-infin-stock-bot.cloudfunctions.net/todo-inbox-write';
const TODO_API_KEY = 'tZrCvMfEa16iuQdFcnmGyDASHk9l5h3q0oK2xTbLY4wVWpjR';

let state = {
  gistToken: '',
  gistId: DEFAULT_GIST_ID,
  mapData: { updated_at: null, items: [] },
  goalsData: { updated_at: null, goals: [] },
  // 목표 기록: { '2026-09': [record, ...] } — Gist의 hq_records_YYYY-MM.json과 1:1
  recordsByMonth: {},
};

// todo-app 원본 데이터 캐시 (완료 처리 시 전체를 다시 write해야 해서 보관)
let todoRaw = { items: [], topics: [], recurring: [], checklist_sets: [] };

function loadLocal() {
  const raw = localStorage.getItem('hq_state');
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    } catch (e) {}
  }
}

function saveLocal() {
  localStorage.setItem('hq_state', JSON.stringify(state));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// 헤더 상단에 상시 노출되는 마지막 저장 상태 (토스트는 금방 사라져서 보조 수단으로 유지)
function updateSaveStatus(success) {
  const el = document.getElementById('save-status');
  if (!el) return;
  const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  el.textContent = success ? ` · 마지막 저장 ${time} ✓` : ' · 저장 실패 ⚠';
  el.style.color = success ? '' : '#ff6b6b';
}

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabbar button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelector(`.tabbar button[data-tab="${name}"]`).classList.add('active');
}

// ══════════════════════════════════════════════
//  GIST API (기존 대시보드 패턴 재사용)
// ══════════════════════════════════════════════
async function syncGist() {
  const token = state.gistToken;
  const gistId = state.gistId;
  if (!gistId) { showToast('Gist ID를 먼저 입력해주세요'); return; }
  try {
    const headers = { Accept: 'application/vnd.github.v3+json' };
    if (token) headers.Authorization = `token ${token}`;
    const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();

    const mapContent = await readGistFile(data, GIST_FILENAME);
    if (mapContent) state.mapData = JSON.parse(mapContent);

    const goalsContent = await readGistFile(data, GOALS_FILENAME);
    if (goalsContent) state.goalsData = JSON.parse(goalsContent);

    await mergeRemoteRecords(data);
    // 예전 daily_log → 기록 이관 (추가만 하는 방식, 토큰이 있는 기기에서만 새 파일로 저장)
    const migratedMonths = migrateDailyLogToRecords();

    saveLocal();
    renderAll();
    showToast('불러오기 완료');
    if (state.gistToken) migratedMonths.forEach(m => saveRecordsMonth(m));
  } catch (e) {
    showToast('불러오기 실패: ' + e.message);
  }
}

async function readGistFile(gistData, filename) {
  const file = gistData.files[filename];
  if (!file) return null;
  let content = file.content;
  if (file.truncated && file.raw_url) {
    const rawRes = await fetch(file.raw_url);
    if (!rawRes.ok) throw new Error(rawRes.status);
    content = await rawRes.text();
  }
  return content;
}

async function saveFileToGist(filename, dataObj, successMsg) {
  const token = state.gistToken;
  const gistId = state.gistId;
  if (!token || !gistId) { showToast('토큰과 Gist ID를 먼저 입력해주세요'); return; }
  try {
    const body = JSON.stringify({
      files: { [filename]: { content: JSON.stringify(dataObj, null, 2) } }
    });
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body
    });
    if (!res.ok) throw new Error(res.status);
    saveLocal();
    showToast(successMsg || 'Gist에 저장 완료');
    updateSaveStatus(true);
  } catch (e) {
    showToast('Gist 저장 실패 — 토큰 확인');
    updateSaveStatus(false);
  }
}

function saveToGist() {
  return saveFileToGist(GIST_FILENAME, state.mapData, '자료지도 저장 완료');
}

function saveGoalsToGist() {
  return saveFileToGist(GOALS_FILENAME, state.goalsData, '목표 저장 완료');
}

function saveGistConfig() {
  state.gistToken = document.getElementById('token-input').value.trim();
  state.gistId = document.getElementById('gist-id-input').value.trim() || DEFAULT_GIST_ID;
  saveLocal();
  showToast('설정 저장 완료');
}

const DAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];

function freqLabel(r) {
  if (r.freq === 'daily') return '매일';
  if (r.freq === 'weekly') return `매주 ${DAYS_KO[r.day_of_week]}`;
  if (r.freq === 'biweekly') return `격주 ${DAYS_KO[r.day_of_week]}`;
  if (r.freq === 'monthly') return r.day_of_month === 0 ? '매월 말일' : `매월 ${r.day_of_month}일`;
  return '';
}

// checklist_sets는 매일 리셋됨(자정 지나면 checked_today 초기화) — todo-app과 동일 로직
function checkResetChecklistSets() {
  const today = localDateStr(new Date());
  todoRaw.checklist_sets.forEach(cs => {
    if (cs.last_reset_date !== today) { cs.checked_today = []; cs.last_reset_date = today; }
  });
}

// ── todo-app과 동일한 "이번 주" 범위·데드라인 판정 (오늘업무/주간업무 자동편입용) ──
function getWeekRange() {
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday); monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23, 59, 59, 999);
  return { monday, sunday };
}
function isDateThisWeek(dateStr) {
  const parts = dateStr.split('-').map(Number);
  const target = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
  const { monday, sunday } = getWeekRange();
  return target >= monday && target <= sunday;
}

// ── todo-app과 동일한 단일 반복업무 활성 판정 (저장된 status를 그대로 믿지 않고 매번 재계산) ──
function lastOccurrence(dow) {
  const d = new Date(); const diff = (d.getDay() - dow + 7) % 7;
  d.setDate(d.getDate() - diff); d.setHours(0, 0, 0, 0); return d;
}
function getLastDayOfMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function shouldActivateRec(r) {
  const now = new Date();
  if (r.freq === 'daily') {
    if (!r.last_done_at) return true;
    return new Date(r.last_done_at).toDateString() !== now.toDateString();
  }
  if (r.freq === 'weekly') {
    if (now.getDay() !== r.day_of_week) return false;
    if (!r.last_done_at) return true;
    return new Date(r.last_done_at) < lastOccurrence(r.day_of_week);
  }
  if (r.freq === 'biweekly') {
    if (now.getDay() !== r.day_of_week) return false;
    if (!r.last_activated_at) return true;
    return (now - new Date(r.last_activated_at)) >= 13 * 24 * 60 * 60 * 1000;
  }
  if (r.freq === 'monthly') {
    const target = r.day_of_month === 0 ? getLastDayOfMonth(now.getFullYear(), now.getMonth()) : r.day_of_month;
    if (now.getDate() !== target) return false;
    if (!r.last_done_at) return true;
    const d = new Date(r.last_done_at);
    return d.getFullYear() < now.getFullYear() || (d.getFullYear() === now.getFullYear() && d.getMonth() < now.getMonth());
  }
  return false;
}
function checkRecActivation() {
  const nowIso = new Date().toISOString();
  todoRaw.recurring.forEach(r => {
    if (shouldActivateRec(r)) {
      if (r.status !== 'active') r.activated_at = nowIso;
      r.status = 'active';
      if (r.freq === 'biweekly') r.last_activated_at = nowIso;
    }
  });
}

function renderHomeTodo() {
  const el = document.getElementById('home-todo');
  const today = localDateStr(new Date());
  const wid = mondayISO(new Date());

  const candidates = todoRaw.items.filter(i => i.deadline_type === 'exact' && i.deadline_value && i.status !== 'done');

  /* todo-app 업무탭과 동일 규칙: 기한이 오늘이거나 지난(연체) 항목 + 수동 추가(pin)는 완료/해제 전까지 유지.
     pin의 날짜/주 값은 비교하지 않는다(값이 있으면 유지). */
  const isOnOrBeforeToday = (d) => d <= today;
  const weekOnlyDeadline = (i) => i.deadline_value && isDateThisWeek(i.deadline_value) && !isOnOrBeforeToday(i.deadline_value);

  const pinnedTodayItems = todoRaw.items.filter(i =>
    !!i.pinned_today && i.status !== 'done' &&
    !(i.deadline_type === 'exact' && i.deadline_value && isOnOrBeforeToday(i.deadline_value))
  );
  const todayItems = [...candidates.filter(i => isOnOrBeforeToday(i.deadline_value)), ...pinnedTodayItems];
  const todayIds = new Set(todayItems.map(i => i.id));

  const pinnedWeekItems = todoRaw.items.filter(i =>
    !!i.pinned_week && i.status !== 'done' && !todayIds.has(i.id) &&
    !(i.deadline_type === 'exact' && i.deadline_value && weekOnlyDeadline(i))
  );
  const weekItems = [
    ...candidates.filter(weekOnlyDeadline),
    ...pinnedWeekItems,
  ];

  checkRecActivation();
  const activeRecurring = todoRaw.recurring.filter(r => r.status === 'active');

  checkResetChecklistSets();
  const checklistGroups = todoRaw.checklist_sets
    .map(cs => ({ cs, remaining: cs.items.filter(it => !cs.checked_today.includes(it.id)).sort((a, b) => a.order - b.order) }))
    .filter(g => g.remaining.length > 0);

  if (!todayItems.length && !weekItems.length && !activeRecurring.length && !checklistGroups.length) {
    el.innerHTML = '<div class="empty">오늘·주간 업무가 없어요 (todo-app 업무 탭에서 지정)</div>';
    return;
  }

  let html = '';
  if (todayItems.length) {
    html += '<div class="todo-sub-title">오늘업무</div>' + todayItems.map(i => todoRowHtml(i)).join('');
  }
  if (weekItems.length || activeRecurring.length) {
    html += '<div class="todo-sub-title">주간업무</div>'
      + weekItems.map(i => todoRowHtml(i)).join('')
      + activeRecurring.map(r => recurringRowHtml(r)).join('');
  }
  if (checklistGroups.length) {
    html += '<div class="todo-sub-title">반복업무</div>' + checklistGroups.map(g => checklistGroupHtml(g)).join('');
  }
  el.innerHTML = html;
}

function noteHtml(note) {
  return note ? `<div class="todo-note">${escapeHtml(note)}</div>` : '';
}

function todoRowHtml(i) {
  return `<div class="todo-row"><input type="checkbox" onclick="completeTodoItem('${i.id}')" /><span>${escapeHtml(i.text)}</span></div>${noteHtml(i.note)}`;
}

function recurringRowHtml(r) {
  return `<div class="todo-row"><input type="checkbox" onclick="completeRecurringItem('${r.id}')" /><span>${escapeHtml(r.text)} <span class="goal-period">${escapeHtml(freqLabel(r))}</span></span></div>${noteHtml(r.note)}`;
}

function checklistGroupHtml(g) {
  const subItems = g.remaining.map(it =>
    `<div class="todo-row" style="padding-left:14px"><input type="checkbox" onclick="completeChecklistSubItem('${g.cs.id}','${it.id}')" /><span>${escapeHtml(it.text)}</span></div>`
  ).join('');
  return `<div class="todo-sub-title" style="margin-top:8px">${escapeHtml(g.cs.title)}</div>${subItems}`;
}

// 바뀐 객체만 보낸다 — 서버(mergeById)가 id 기준으로 병합하고 서버에만 있는 항목은 보존하므로,
// 전체 목록을 보내면 오래된 사본이 다른 항목의 최신 수정을 되돌릴 수 있다.
async function writeTodoPartial(payload, successMsg) {
  try {
    const res = await fetch(TODO_WRITE_URL, {
      method: 'POST',
      headers: { 'X-API-Key': TODO_API_KEY, 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(res.status);
    showToast(successMsg || '완료 처리됨');
    updateSaveStatus(true);
  } catch (e) {
    showToast('완료 반영 실패 — 새로고침 후 다시 시도해주세요');
    updateSaveStatus(false);
  }
}

function completeTodoItem(id) {
  const item = todoRaw.items.find(i => i.id === id);
  if (!item) return;
  item.status = 'done';
  item.completed_at = new Date().toISOString();
  renderHomeTodo();
  writeTodoPartial({ items: [item] });
}

function completeRecurringItem(id) {
  const r = todoRaw.recurring.find(x => x.id === id);
  if (!r) return;
  r.status = 'done';
  r.last_done_at = new Date().toISOString();
  r.skipped = false;
  renderHomeTodo();
  writeTodoPartial({ recurring: [r] });
}

function completeChecklistSubItem(setId, itemId) {
  const cs = todoRaw.checklist_sets.find(c => c.id === setId);
  if (!cs) return;
  if (!cs.checked_today.includes(itemId)) cs.checked_today.push(itemId);
  renderHomeTodo();
  writeTodoPartial({ checklist_sets: [cs] });
}

//  자료지도 렌더링

function renderAll() {
  renderUpdatedLabel();
  renderPinned();
  renderHomeSummary();
  renderSearch(document.getElementById('search-input').value);
  renderGoals();
  renderHomeGoals();
}

function renderPinned() {
  const el = document.getElementById('pinned-list');
  const items = (state.mapData.items || []).filter(it => it.pinned);
  if (!items.length) {
    el.innerHTML = '<div class="empty">아직 없어요. 자료지도 검색 결과에서 ★ 라벨 수정으로 추가해보세요.</div>';
    return;
  }
  el.innerHTML = items.map(it => resultItemHtml(it)).join('');
}

function renderUpdatedLabel() {
  const label = document.getElementById('updated-label');
  const items = state.mapData.items || [];
  if (!items.length) {
    label.textContent = '자료지도가 비어 있어요. Gist 연동에서 불러오세요.';
    return;
  }
  const dt = state.mapData.updated_at ? new Date(state.mapData.updated_at) : null;
  label.textContent = `자료 ${items.length}건` + (dt ? ` · ${dt.toLocaleDateString('ko-KR')} 기준` : '');
}

function renderHomeSummary() {
  const items = state.mapData.items || [];
  const el = document.getElementById('home-summary');
  if (!items.length) {
    el.innerHTML = '<span class="summary-pill">자료지도 없음</span>';
    return;
  }
  const byCategory = {};
  items.forEach(it => {
    const cat = (it.category || '기타').split('/')[0];
    byCategory[cat] = (byCategory[cat] || 0) + 1;
  });
  el.innerHTML = Object.entries(byCategory)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, n]) => `<span class="summary-pill">${escapeHtml(cat)} <b>${n}</b></span>`)
    .join('');
}

function renderSearch(query) {
  const resultsEl = document.getElementById('search-results');
  const items = state.mapData.items || [];
  const q = (query || '').trim().toLowerCase();

  if (!q) {
    resultsEl.innerHTML = '<div class="empty">검색어를 입력하세요</div>';
    return;
  }

  const matched = items.filter(it => {
    const haystack = [it.name, it.category, ...(it.keywords || [])].join(' ').toLowerCase();
    return haystack.includes(q);
  }).slice(0, 100);

  if (!matched.length) {
    resultsEl.innerHTML = '<div class="empty">검색 결과가 없어요</div>';
    return;
  }

  resultsEl.innerHTML = matched.map(it => resultItemHtml(it)).join('');
}

function resultItemHtml(it) {
  const isUrl = /^https?:\/\//.test(it.path_or_url || '');
  const pathHtml = isUrl
    ? `<a href="${escapeHtml(it.path_or_url)}" target="_blank">${escapeHtml(it.path_or_url)}</a>`
    : escapeHtml(it.path_or_url || '');
  const star = it.pinned ? '★' : '☆';
  return `<div class="result-item">
    <div class="name">${escapeHtml(it.name)} <span style="color:var(--text3);font-size:11px;">[${escapeHtml(it.category || '')}]</span></div>
    <div class="meta">${pathHtml}</div>
    <button class="label-edit-btn" onclick="editLabel('${it.id}')">${star} 라벨 수정</button>
  </div>`;
}

function editLabel(id) {
  const item = (state.mapData.items || []).find(x => x.id === id);
  if (!item) return;

  const newName = prompt('라벨(이름)', item.name);
  if (newName === null) return;
  const newKeywords = prompt('키워드 (쉼표로 구분)', (item.keywords || []).join(', '));
  if (newKeywords === null) return;

  item.name = newName.trim() || item.name;
  item.keywords = newKeywords.split(',').map(k => k.trim()).filter(Boolean);
  item.pinned = true;
  item.source = item.source === 'scan' ? 'labeled' : item.source;
  state.mapData.updated_at = new Date().toISOString();

  saveLocal();
  renderAll();
  saveToGist();
}

function addManualItem() {
  const name = document.getElementById('manual-name').value.trim();
  const path = document.getElementById('manual-path').value.trim();
  const keywords = document.getElementById('manual-keywords').value.trim();
  if (!name || !path) { showToast('이름과 경로를 입력해주세요'); return; }

  const item = {
    id: crypto.randomUUID(),
    name,
    type: /^https?:\/\//.test(path) ? 'webapp' : 'folder',
    path_or_url: path,
    category: '수동등록',
    keywords: keywords.split(',').map(k => k.trim()).filter(Boolean),
    source: 'manual',
    pinned: true,
  };
  state.mapData.items = state.mapData.items || [];
  state.mapData.items.push(item);
  state.mapData.updated_at = new Date().toISOString();
  saveLocal();
  renderAll();

  document.getElementById('manual-name').value = '';
  document.getElementById('manual-path').value = '';
  document.getElementById('manual-keywords').value = '';

  saveToGist();
}

// ══════════════════════════════════════════════
//  목표 — 달력 도장 + 날짜별 상세 기록
//  · "기록(records)"이 원본이고, 도장과 일/주/월/분기/반기 집계는 전부 기록에서 계산한다
//  · 기록은 월별 파일(hq_records_YYYY-MM.json)로 같은 Gist에 저장한다 (파일이 커지는 것과 기기 간 덮어쓰기 방지)
//  · 도장 규칙: 그날 그 목표의 기록이 1건이라도 있으면 찍힌다. 하루 목표치를 채우면 속이 찬 도장.
// ══════════════════════════════════════════════
function round2(n) { return Math.round(n * 100) / 100; }

// 로컬 타임존 기준 YYYY-MM-DD (toISOString은 UTC라서 자정 근처에 날짜가 하루 밀릴 수 있어 사용 안 함)
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function mondayISO(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0=일 ... 1=월
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return localDateStr(date);
}

// ── 요일 선택 칩 ──
const DAY_CHIP_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
function renderDayChips() {
  document.getElementById('goal-days-chips').innerHTML = DAY_CHIP_LABELS
    .map((label, i) => `<span class="day-chip active" data-day="${i}" onclick="toggleDayChip(this)">${label}</span>`)
    .join('');
}
function toggleDayChip(el) { el.classList.toggle('active'); }
function setActiveDaysPreset(preset) {
  document.querySelectorAll('#goal-days-chips .day-chip').forEach(chip => {
    const day = Number(chip.dataset.day);
    let active = true;
    if (preset === 'weekday') active = day >= 1 && day <= 5;
    else if (preset === 'weekend') active = day === 0 || day === 6;
    chip.classList.toggle('active', active);
  });
}
function getSelectedActiveDays() {
  return Array.from(document.querySelectorAll('#goal-days-chips .day-chip.active')).map(chip => Number(chip.dataset.day));
}

// ── 목표 공통 ──
const STAMP_COLORS = ['#4F8CFF', '#1D9E75', '#D85A30', '#7F77DD', '#BA7517', '#D4537E', '#3B9AA3', '#639922'];

// 목표를 만든 순서대로 색을 배정한다 (8개까지는 겹치지 않고, 기기가 달라도 같은 목표는 같은 색).
// 목표를 지우면 그 뒤 목표들의 색이 한 칸씩 당겨질 수 있다.
function goalColor(g) {
  const sorted = activeGoals().slice().sort((a, b) =>
    (a.created_at || '').localeCompare(b.created_at || '') || String(a.id).localeCompare(String(b.id)));
  const idx = sorted.findIndex(x => x.id === g.id);
  if (idx >= 0) return STAMP_COLORS[idx % STAMP_COLORS.length];
  let h = 0; // 활성 목록에 없는 목표(예: 숨겨진 예전 목표)는 id 해시로 고정
  for (const ch of String(g.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return STAMP_COLORS[h % STAMP_COLORS.length];
}
function goalChar(g) { return (g.title || '?').trim().charAt(0) || '?'; }

// 수동형(마일스톤) 목표는 폐지 — 예전 데이터에 남아 있어도 화면에서는 숨기기만 하고 지우지 않는다
function activeGoals() {
  return (state.goalsData.goals || []).filter(g => g.track_type === 'stopwatch' || g.track_type === 'counter');
}
function findGoal(id) { return (state.goalsData.goals || []).find(g => g.id === id); }
function goalActiveDays(g) { return g.active_days && g.active_days.length ? g.active_days : [0, 1, 2, 3, 4, 5, 6]; }
function isActiveToday(g) { return goalActiveDays(g).includes(new Date().getDay()); }

// ── 기록(records) 저장소 ──
const RECORD_FILE_RE = /^hq_records_(\d{4}-\d{2})\.json$/;
function recordsFilename(month) { return `hq_records_${month}.json`; }
function recTime(r) { return r.updated_at || r.created_at || ''; }

// id 기준 병합 — 같은 id면 updated_at이 최신인 쪽이 이긴다 (삭제는 deleted 표시로 전파)
function mergeRecordLists(a, b) {
  const map = new Map();
  [...b, ...a].forEach(r => {
    if (!r || !r.id) return;
    const cur = map.get(r.id);
    if (!cur || recTime(r) >= recTime(cur)) map.set(r.id, r);
  });
  return Array.from(map.values());
}

function liveRecords() {
  return Object.values(state.recordsByMonth || {}).flat().filter(r => !r.deleted);
}

// 렌더링 때마다 목표별·날짜별 합계를 다시 만들면 낭비라서, 기록이 바뀔 때만 무효화한다
let recordIndexCache = null;
function invalidateRecordIndex() { recordIndexCache = null; }
function recordIndex() {
  if (recordIndexCache) return recordIndexCache;
  const byGoalDate = new Map();   // goalId -> Map(date -> 그날 합계)
  const stampsByDate = new Map(); // date -> Set(goalId)
  liveRecords().forEach(r => {
    if (!byGoalDate.has(r.goal_id)) byGoalDate.set(r.goal_id, new Map());
    const m = byGoalDate.get(r.goal_id);
    m.set(r.date, round2((m.get(r.date) || 0) + (Number(r.amount) || 0)));
    if (!stampsByDate.has(r.date)) stampsByDate.set(r.date, new Set());
    stampsByDate.get(r.date).add(r.goal_id);
  });
  recordIndexCache = { byGoalDate, stampsByDate };
  return recordIndexCache;
}

function sumRecordsInRange(g, startStr, endStr) {
  const m = recordIndex().byGoalDate.get(g.id);
  if (!m) return 0;
  let sum = 0;
  m.forEach((amt, date) => { if (date >= startStr && date <= endStr) sum += amt; });
  return round2(sum);
}

function findRecord(id) {
  for (const [month, list] of Object.entries(state.recordsByMonth || {})) {
    const rec = list.find(x => x.id === id);
    if (rec) return { rec, month };
  }
  return null;
}

function addRecord({ goalId, date, amount, start = null, end = null, note = '', source = 'manual' }) {
  const now = new Date().toISOString();
  const rec = {
    id: crypto.randomUUID(), goal_id: goalId, date, amount: round2(amount),
    start, end, note, source, created_at: now, updated_at: now,
  };
  const month = date.slice(0, 7);
  state.recordsByMonth = state.recordsByMonth || {};
  (state.recordsByMonth[month] = state.recordsByMonth[month] || []).push(rec);
  recordsChanged(month);
  return rec;
}

function updateRecord(id, patch) {
  const f = findRecord(id);
  if (!f) return;
  Object.assign(f.rec, patch, { updated_at: new Date().toISOString() });
  recordsChanged(f.month);
}

function deleteRecord(id) {
  const f = findRecord(id);
  if (!f) return;
  f.rec.deleted = true;
  f.rec.updated_at = new Date().toISOString();
  recordsChanged(f.month);
}

function recordsChanged(month) {
  invalidateRecordIndex();
  saveLocal();
  renderGoals();
  renderHomeGoals();
  saveRecordsMonth(month);
}

// 같은 달 저장을 순서대로 처리한다 (연달아 눌러도 서로 덮어쓰지 않게)
const recordSaveQueue = {};
function saveRecordsMonth(month) {
  const prev = recordSaveQueue[month] || Promise.resolve();
  const next = prev.then(() => doSaveRecordsMonth(month)).catch(() => {});
  recordSaveQueue[month] = next;
  return next;
}

async function doSaveRecordsMonth(month) {
  const token = state.gistToken;
  const gistId = state.gistId;
  if (!token || !gistId) { showToast('토큰과 Gist ID를 먼저 입력해주세요'); return; }
  try {
    // 다른 기기에서 추가한 기록을 덮어쓰지 않도록 최신본을 받아 id 기준으로 합친 뒤 그 달 파일만 저장한다
    const getRes = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' },
    });
    if (!getRes.ok) throw new Error(getRes.status);
    const gist = await getRes.json();
    const remoteText = await readGistFile(gist, recordsFilename(month));
    let remote = [];
    if (remoteText) {
      // 원격 파일을 못 읽으면 덮어쓰지 않고 중단한다 (손상된 파일을 빈 값으로 밀어버리지 않기 위해)
      remote = JSON.parse(remoteText).records || [];
    }
    const merged = mergeRecordLists(state.recordsByMonth[month] || [], remote);
    state.recordsByMonth[month] = merged;
    invalidateRecordIndex();

    const body = JSON.stringify({
      files: { [recordsFilename(month)]: { content: JSON.stringify({ month, records: merged }, null, 2) } },
    });
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body,
    });
    if (!res.ok) throw new Error(res.status);
    saveLocal();
    updateSaveStatus(true);
    renderGoals();
    renderHomeGoals();
    showToast('기록 저장 완료');
  } catch (e) {
    showToast('기록 저장 실패 — 토큰 확인');
    updateSaveStatus(false);
  }
}

// Gist에 있는 월별 기록 파일을 전부 읽어 로컬과 합친다
async function mergeRemoteRecords(gistData) {
  state.recordsByMonth = state.recordsByMonth || {};
  for (const name of Object.keys(gistData.files || {})) {
    const m = RECORD_FILE_RE.exec(name);
    if (!m) continue;
    const text = await readGistFile(gistData, name);
    if (!text) continue;
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) { continue; }
    state.recordsByMonth[m[1]] = mergeRecordLists(state.recordsByMonth[m[1]] || [], parsed.records || []);
  }
  invalidateRecordIndex();
}

// 예전 daily_log(목표 안에 든 날짜별 합계)를 기록으로 옮긴다. 결정적 id라서 여러 번·여러 기기에서 돌려도
// 중복이 생기지 않고, 이미 옮겼거나(사용자가 지운 것 포함) 새로 만든 기록은 건드리지 않는다.
// daily_log 자체는 지우지 않고 그대로 둔다(백업 겸용). 새로 만든 기록이 있는 달 목록을 돌려준다.
function migrateDailyLogToRecords() {
  const changed = new Set();
  state.recordsByMonth = state.recordsByMonth || {};
  (state.goalsData.goals || []).forEach(g => {
    (g.daily_log || []).forEach(e => {
      if (!e || typeof e.date !== 'string' || !(Number(e.amount) > 0)) return;
      const id = `mig_${g.id}_${e.date}`;
      const month = e.date.slice(0, 7);
      const list = (state.recordsByMonth[month] = state.recordsByMonth[month] || []);
      if (list.some(r => r.id === id)) return;
      const now = new Date().toISOString();
      list.push({
        id, goal_id: g.id, date: e.date, amount: round2(Number(e.amount)),
        start: null, end: null, note: '', source: 'migrated', created_at: now, updated_at: now,
      });
      changed.add(month);
    });
  });
  if (changed.size) invalidateRecordIndex();
  return changed;
}

// ── 일/주/월/분기/반기 집계 (기록에서 계산) ──
function countActiveDaysInRange(g, start, end) {
  const days = goalActiveDays(g);
  let count = 0;
  const cur = new Date(start);
  while (cur <= end) {
    if (days.includes(cur.getDay())) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }
function quarterStartMonth(m) { return Math.floor(m / 3) * 3; }
function startOfQuarter(d) { return new Date(d.getFullYear(), quarterStartMonth(d.getMonth()), 1); }
function endOfQuarter(d) { return new Date(d.getFullYear(), quarterStartMonth(d.getMonth()) + 3, 0); }
function startOfHalf(d) { return new Date(d.getFullYear(), d.getMonth() < 6 ? 0 : 6, 1); }
function endOfHalf(d) { return new Date(d.getFullYear(), d.getMonth() < 6 ? 6 : 12, 0); }

// 목표의 일/주/월/분기/반기 누적치·기대치(하루 목표치 × 기간 내 활성요일 수)를 계산
function goalTiers(g) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const { monday, sunday } = getWeekRange();
  const weekStart = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate());
  const weekEnd = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate());

  const ranges = [
    { key: 'day', label: '오늘', start: today, end: today },
    { key: 'week', label: '이번주', start: weekStart, end: weekEnd },
    { key: 'month', label: '이번달', start: startOfMonth(now), end: endOfMonth(now) },
    { key: 'quarter', label: '분기', start: startOfQuarter(now), end: endOfQuarter(now) },
    { key: 'half', label: '반기', start: startOfHalf(now), end: endOfHalf(now) },
  ];

  return ranges.map(r => {
    const startStr = localDateStr(r.start), endStr = localDateStr(r.end);
    const current = sumRecordsInRange(g, startStr, endStr);
    const activeDayCount = countActiveDaysInRange(g, r.start, r.end);
    const expected = g.target ? round2(g.target * activeDayCount) : null;
    return { key: r.key, label: r.label, current, expected };
  });
}

// ── 목표 추가·수정·삭제 ──
function addGoal() {
  const category = document.getElementById('goal-category').value.trim();
  const trackType = document.getElementById('goal-track-type').value;
  const title = document.getElementById('goal-title').value.trim();
  const targetRaw = document.getElementById('goal-target').value.trim();
  const unit = document.getElementById('goal-unit').value.trim();
  if (!title) { showToast('목표 제목을 입력해주세요'); return; }

  const activeDays = getSelectedActiveDays();
  const goal = {
    id: crypto.randomUUID(),
    category,
    track_type: trackType,
    title,
    target: targetRaw ? Number(targetRaw) : null,
    unit,
    active_days: activeDays.length ? activeDays : [0, 1, 2, 3, 4, 5, 6],
    running_since: null,
    created_at: new Date().toISOString(),
  };

  state.goalsData.goals = state.goalsData.goals || [];
  state.goalsData.goals.push(goal);
  state.goalsData.updated_at = new Date().toISOString();
  saveLocal();
  renderGoals();
  renderHomeGoals();

  document.getElementById('goal-category').value = '';
  document.getElementById('goal-title').value = '';
  document.getElementById('goal-target').value = '';
  document.getElementById('goal-unit').value = '';
  setActiveDaysPreset('all');

  saveGoalsToGist();
}

function persistGoalChange() {
  state.goalsData.updated_at = new Date().toISOString();
  saveLocal();
  renderGoals();
  renderHomeGoals();
  saveGoalsToGist();
}

function editGoal(id) {
  const goal = findGoal(id);
  if (!goal) return;

  const newCategory = prompt('분야', goal.category || '');
  if (newCategory === null) return;
  const newTitle = prompt('목표 제목', goal.title);
  if (newTitle === null) return;
  const newTargetRaw = prompt('하루 목표 수치 (선택, 비우면 없음)', goal.target ?? '');
  if (newTargetRaw === null) return;
  const newUnit = prompt('단위', goal.unit || '');
  if (newUnit === null) return;
  const daysRaw = prompt('활성 요일 (0=일 1=월 2=화 3=수 4=목 5=금 6=토, 쉼표로 구분)', goalActiveDays(goal).join(','));
  if (daysRaw === null) return;

  goal.category = newCategory.trim();
  goal.title = newTitle.trim() || goal.title;
  goal.target = newTargetRaw.trim() ? Number(newTargetRaw) : null;
  goal.unit = newUnit.trim();
  const parsed = daysRaw.split(',').map(s => Number(s.trim())).filter(n => !Number.isNaN(n) && n >= 0 && n <= 6);
  if (parsed.length) goal.active_days = parsed;

  persistGoalChange();
}

function deleteGoal(id) {
  if (!confirm('이 목표를 삭제할까요? (지금까지의 기록 파일은 남고, 화면에서만 사라져요)')) return;
  state.goalsData.goals = (state.goalsData.goals || []).filter(g => g.id !== id);
  persistGoalChange();
}

// ── 빠른 기록: 스톱워치 · 카운터 · 직접 입력 ──
function startStopwatch(id) {
  const goal = findGoal(id);
  if (!goal || !isActiveToday(goal)) return;
  goal.running_since = Date.now();
  saveLocal();
  renderGoals();
  renderHomeGoals();
}

function stopStopwatch(id) {
  const goal = findGoal(id);
  if (!goal || !goal.running_since) return;
  const startMs = goal.running_since;
  const elapsedHours = (Date.now() - startMs) / 3600000;
  goal.running_since = null;
  saveLocal();

  if (elapsedHours > 5) {
    showToast('5시간 초과로 기록하지 않았어요 — 날짜 상세의 "기록 추가"로 직접 입력해주세요');
    renderGoals();
    renderHomeGoals();
    return;
  }
  const amount = round2(elapsedHours);
  if (amount <= 0) {
    showToast('너무 짧아서 기록하지 않았어요');
    renderGoals();
    renderHomeGoals();
    return;
  }
  // 날짜는 시작한 날 기준 (자정을 넘긴 세션도 시작한 날의 도장이 된다)
  addRecord({
    goalId: id, date: localDateStr(new Date(startMs)), amount,
    start: new Date(startMs).toISOString(), end: new Date().toISOString(), source: 'stopwatch',
  });
}

function incrementCounter(id) {
  const goal = findGoal(id);
  if (!goal || !isActiveToday(goal)) return;
  addRecord({ goalId: id, date: localDateStr(new Date()), amount: 1, source: 'counter' });
}

function manualAddAmount(id) {
  const goal = findGoal(id);
  if (!goal || !isActiveToday(goal)) return;
  const isStopwatch = goal.track_type === 'stopwatch';
  const raw = prompt(isStopwatch ? '추가할 시간 (시간 단위, 예: 1.5)' : '추가할 개수');
  if (raw === null) return;
  const num = Number(raw);
  const amount = isStopwatch ? round2(num) : Math.round(num);
  if (Number.isNaN(num) || amount <= 0) { showToast('0보다 큰 숫자를 입력해주세요'); return; }
  const note = prompt('메모 (선택)');
  addRecord({ goalId: id, date: localDateStr(new Date()), amount, note: (note || '').trim(), source: 'manual' });
}

// ── 달력 ──
const calState = (() => {
  const now = new Date();
  return { year: now.getFullYear(), month: now.getMonth(), selected: localDateStr(now), filter: null, addOpen: false };
})();

function calShift(delta) {
  calState.month += delta;
  if (calState.month < 0) { calState.month = 11; calState.year--; }
  if (calState.month > 11) { calState.month = 0; calState.year++; }
  calState.addOpen = false;
  renderCalendar();
  renderDayDetail();
}

function calToday() {
  const now = new Date();
  calState.year = now.getFullYear();
  calState.month = now.getMonth();
  calState.selected = localDateStr(now);
  calState.addOpen = false;
  renderCalendar();
  renderDayDetail();
}

function calSetFilter(goalId) {
  calState.filter = goalId || null;
  renderCalendar();
  renderDayDetail();
}

function calSelect(date) {
  calState.selected = date;
  calState.addOpen = false;
  renderCalendar();
  renderDayDetail();
}

// 홈의 주간 도장판에서 날짜를 누르면 목표 탭의 그 날짜로 이동
function openGoalDay(date) {
  const [y, m] = date.split('-').map(Number);
  calState.year = y;
  calState.month = m - 1;
  calState.selected = date;
  calState.addOpen = false;
  switchTab('goals');
  renderGoals();
}

// 도장: 색과 글자(목표 이름 첫 글자)로 목표를 구분, 하루 목표치를 채우면 속이 찬 도장
function stampHtml(g, dayAmount) {
  const c = goalColor(g);
  const reached = g.target && dayAmount >= g.target;
  const style = reached ? `background:${c};border-color:${c};color:#fff` : `border-color:${c};color:${c}`;
  return `<span class="stamp" style="${style}">${escapeHtml(goalChar(g))}</span>`;
}

function renderCalendar() {
  const goals = activeGoals();
  const filterGoal = calState.filter ? goals.find(g => g.id === calState.filter) : null;
  if (calState.filter && !filterGoal) calState.filter = null;
  const visible = filterGoal ? [filterGoal] : goals;
  const { stampsByDate, byGoalDate } = recordIndex();
  const today = localDateStr(new Date());

  document.getElementById('cal-title').textContent = `${calState.year}년 ${calState.month + 1}월`;

  document.getElementById('cal-chips').innerHTML =
    `<span class="cal-chip ${calState.filter ? '' : 'on'}" onclick="calSetFilter('')">전체</span>` +
    goals.map(g =>
      `<span class="cal-chip ${calState.filter === g.id ? 'on' : ''}" onclick="calSetFilter('${g.id}')"><i style="background:${goalColor(g)}"></i>${escapeHtml(g.title)}</span>`
    ).join('');

  const first = new Date(calState.year, calState.month, 1);
  const lead = (first.getDay() + 6) % 7; // 월요일 시작
  const daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);

  let html = ['월', '화', '수', '목', '금', '토', '일'].map(l => `<div class="cal-h">${l}</div>`).join('') + '<div class="cal-h">도장</div>';
  let monthStamps = 0;
  const stampDays = new Set();

  for (let r = 0; r < cells.length / 7; r++) {
    let weekStamps = 0;
    for (let c = 0; c < 7; c++) {
      const d = cells[r * 7 + c];
      if (d === null) { html += '<div class="cal-cell blank"></div>'; continue; }
      const date = `${calState.year}-${String(calState.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const ids = stampsByDate.get(date);
      const shown = ids ? visible.filter(g => ids.has(g.id)) : [];
      weekStamps += shown.length;
      monthStamps += shown.length;
      if (shown.length) stampDays.add(date);
      // 목표를 하나만 골랐을 때, 그 목표의 활동일이 아닌 요일은 점선 칸으로 표시
      const dow = (c + 1) % 7;
      const off = filterGoal && !goalActiveDays(filterGoal).includes(dow);
      const cls = `cal-cell${date === today ? ' today' : ''}${date === calState.selected ? ' sel' : ''}${off ? ' off' : ''}`;
      const stamps = shown.map(g => stampHtml(g, (byGoalDate.get(g.id) || new Map()).get(date) || 0)).join('');
      html += `<div class="${cls}" onclick="calSelect('${date}')"><span class="d">${d}</span><div class="stamps">${stamps}</div></div>`;
    }
    html += `<div class="cal-wk">${weekStamps || ''}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
  document.getElementById('cal-caption').textContent =
    `${calState.month + 1}월 도장 ${monthStamps}개 · 기록한 날 ${stampDays.size}일 — 도장은 그날 기록이 있으면 찍히고, 속이 찬 도장은 하루 목표를 채운 날이에요.`;
}

function formatHM(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function renderDayDetail() {
  const date = calState.selected;
  const [y, m, d] = date.split('-').map(Number);
  const dow = DAYS_KO[new Date(y, m - 1, d).getDay()];
  document.getElementById('day-title').textContent = `${m}월 ${d}일 (${dow}) 기록`;

  const goals = activeGoals();
  const records = liveRecords()
    .filter(r => r.date === date)
    .sort((a, b) => (a.start || a.created_at || '').localeCompare(b.start || b.created_at || ''));

  const listEl = document.getElementById('day-records');
  if (!records.length) {
    listEl.innerHTML = '<div class="empty">이 날은 기록이 없어요</div>';
  } else {
    listEl.innerHTML = records.map(r => {
      const g = goals.find(x => x.id === r.goal_id) || findGoal(r.goal_id);
      const color = g ? goalColor(g) : '#888';
      const title = g ? escapeHtml(g.title) : '(삭제된 목표)';
      const unit = g ? escapeHtml(g.unit || '') : '';
      const time = r.start && r.end ? ` · ${formatHM(r.start)}–${formatHM(r.end)}` : '';
      const note = r.note ? `<div class="rec-note">${escapeHtml(r.note)}</div>` : '';
      return `<div class="rec-row">
        <span class="rec-dot" style="background:${color}"></span>
        <div class="rec-main"><div>${title} · ${r.amount}${unit}${time}</div>${note}</div>
        <div class="goal-actions"><button onclick="editRecord('${r.id}')" title="수정">✎</button><button onclick="removeRecord('${r.id}')" title="삭제">✕</button></div>
      </div>`;
    }).join('');
  }

  const addEl = document.getElementById('day-add');
  if (!goals.length) { addEl.innerHTML = ''; return; }
  if (!calState.addOpen) {
    addEl.innerHTML = '<button class="btn" style="margin-top:10px" onclick="toggleAddRecord()">+ 기록 추가</button>';
    return;
  }
  const preselect = calState.filter || goals[0].id;
  addEl.innerHTML = `<div class="rec-form">
    <select id="rec-goal">${goals.map(g => `<option value="${g.id}" ${g.id === preselect ? 'selected' : ''}>${escapeHtml(g.title)} (${escapeHtml(g.unit || '')})</option>`).join('')}</select>
    <input type="number" id="rec-amount" step="any" inputmode="decimal" placeholder="양 (스톱워치 목표는 시간 단위, 예: 1.5)" />
    <input type="text" id="rec-note" placeholder="메모 (선택)" />
    <div class="rec-form-row">
      <button class="btn" onclick="submitAddRecord()">저장</button>
      <button class="btn" style="background:var(--bg3);color:var(--text1)" onclick="toggleAddRecord()">취소</button>
    </div>
  </div>`;
}

function toggleAddRecord() {
  calState.addOpen = !calState.addOpen;
  renderDayDetail();
}

function submitAddRecord() {
  const g = findGoal(document.getElementById('rec-goal').value);
  if (!g) { showToast('목표를 선택해주세요'); return; }
  const num = Number(document.getElementById('rec-amount').value);
  const amount = g.track_type === 'stopwatch' ? round2(num) : Math.round(num);
  if (Number.isNaN(num) || amount <= 0) { showToast('0보다 큰 숫자를 입력해주세요'); return; }
  const date = calState.selected;
  if (date > localDateStr(new Date())) { showToast('오늘 이후 날짜에는 기록할 수 없어요'); return; }
  const note = document.getElementById('rec-note').value.trim();
  calState.addOpen = false;
  addRecord({ goalId: g.id, date, amount, note, source: 'manual' });
}

function editRecord(id) {
  const f = findRecord(id);
  if (!f) return;
  const g = findGoal(f.rec.goal_id);
  const isStopwatch = g && g.track_type === 'stopwatch';
  const rawAmount = prompt(isStopwatch ? '시간 (시간 단위)' : '개수', f.rec.amount);
  if (rawAmount === null) return;
  const num = Number(rawAmount);
  const amount = isStopwatch ? round2(num) : Math.round(num);
  if (Number.isNaN(num) || amount <= 0) { showToast('0보다 큰 숫자를 입력해주세요'); return; }
  const note = prompt('메모', f.rec.note || '');
  if (note === null) return;
  updateRecord(id, { amount, note: note.trim() });
}

function removeRecord(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  deleteRecord(id);
}

// ── 목표 목록 (오늘의 빠른 기록 + 일/주/월/분기/반기 누적) ──
function renderGoals() {
  renderCalendar();
  renderDayDetail();
  renderGoalList();
}

function renderGoalList() {
  const el = document.getElementById('goals-list');
  const goals = activeGoals();
  if (!goals.length) {
    el.innerHTML = '<div class="empty">아직 목표가 없어요. 아래에서 추가해보세요.</div>';
    return;
  }

  const groups = {};
  goals.forEach(g => {
    const key = g.category || '미분류';
    (groups[key] = groups[key] || []).push(g);
  });

  const catNames = Object.keys(groups).sort((a, b) => {
    if (a === '미분류') return 1;
    if (b === '미분류') return -1;
    return a.localeCompare(b, 'ko');
  });

  el.innerHTML = catNames.map(cat => {
    const items = groups[cat].map(g => goalItemHtml(g)).join('');
    return `<div class="goal-group-title">${escapeHtml(cat)}</div>${items}`;
  }).join('');
}

function quickControlsHtml(g) {
  if (!isActiveToday(g)) return `<div class="goal-inactive-note">오늘은 목표 활동일이 아니에요</div>`;
  if (g.track_type === 'stopwatch') {
    return g.running_since
      ? `<button class="running" onclick="stopStopwatch('${g.id}')">■ 정지 <span class="stopwatch-live" data-start="${g.running_since}">00:00</span></button>
         <button onclick="manualAddAmount('${g.id}')">직접 입력</button>`
      : `<button onclick="startStopwatch('${g.id}')">▶ 시작</button>
         <button onclick="manualAddAmount('${g.id}')">직접 입력</button>`;
  }
  return `<button onclick="incrementCounter('${g.id}')">+1</button>
    <button onclick="manualAddAmount('${g.id}')">직접 입력</button>`;
}

function goalItemHtml(g) {
  const tiersHtml = goalTiers(g).map(t =>
    `<div class="goal-tier-row"><span>${t.label}</span><span>${t.current}${escapeHtml(g.unit || '')}${t.expected != null ? ' / ' + t.expected + escapeHtml(g.unit || '') : ''}</span></div>`
  ).join('');

  return `<div class="goal-item">
    <div class="goal-top">
      <div><span class="rec-dot" style="background:${goalColor(g)};display:inline-block;margin-right:6px"></span><span class="goal-title">${escapeHtml(g.title)}</span></div>
      <div class="goal-actions"><button onclick="editGoal('${g.id}')" title="수정">✎</button><button onclick="deleteGoal('${g.id}')" title="삭제">✕</button></div>
    </div>
    <div class="goal-tiers">${tiersHtml}</div>
    <div class="goal-controls">${quickControlsHtml(g)}</div>
  </div>`;
}

// ── 홈: 이번 주 도장판 (월~일) + 오늘의 빠른 기록 ──
function renderHomeGoals() {
  const el = document.getElementById('home-goals');
  const goals = activeGoals();
  if (!goals.length) {
    el.innerHTML = '<div class="empty">아직 목표가 없어요. 목표 탭에서 추가해보세요.</div>';
    return;
  }

  const today = localDateStr(new Date());
  const monday = new Date(mondayISO(new Date()) + 'T00:00:00');
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(localDateStr(d));
  }
  const { byGoalDate } = recordIndex();

  const head = `<div class="wk-strip wk-head">${['월', '화', '수', '목', '금', '토', '일'].map(l => `<span>${l}</span>`).join('')}</div>`;
  el.innerHTML = head + goals.map(g => {
    const perDay = byGoalDate.get(g.id) || new Map();
    const active = goalActiveDays(g);
    const cells = dates.map((date, i) => {
      const amt = perDay.get(date);
      const off = !active.includes((i + 1) % 7);
      return `<div class="wk-cell${date === today ? ' today' : ''}${off ? ' off' : ''}" onclick="openGoalDay('${date}')">${amt !== undefined ? stampHtml(g, amt) : ''}</div>`;
    }).join('');

    let quick = '';
    if (isActiveToday(g)) {
      if (g.track_type === 'stopwatch') {
        quick = g.running_since
          ? `<button class="wk-quick running" onclick="stopStopwatch('${g.id}')">■ <span class="stopwatch-live" data-start="${g.running_since}">00:00</span></button>`
          : `<button class="wk-quick" onclick="startStopwatch('${g.id}')">▶ 시작</button>`;
      } else {
        quick = `<button class="wk-quick" onclick="incrementCounter('${g.id}')">+1</button>`;
      }
    }
    return `<div class="wk-goal">
      <div class="wk-top"><span class="wk-title"><span class="rec-dot" style="background:${goalColor(g)};display:inline-block;margin-right:6px"></span>${escapeHtml(g.title)}</span>${quick}</div>
      <div class="wk-strip">${cells}</div>
    </div>`;
  }).join('');
}

setInterval(() => {
  document.querySelectorAll('.stopwatch-live').forEach(el => {
    const start = Number(el.dataset.start);
    if (!start) return;
    const elapsedSec = Math.floor((Date.now() - start) / 1000);
    const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
    const s = String(elapsedSec % 60).padStart(2, '0');
    el.textContent = `${m}:${s}`;
  });
}, 1000);

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

document.getElementById('search-input').addEventListener('input', (e) => renderSearch(e.target.value));

// 초기화
loadLocal();
document.getElementById('token-input').value = state.gistToken || '';
document.getElementById('gist-id-input').value = state.gistId || DEFAULT_GIST_ID;
renderDayChips();
state.goalsData = state.goalsData || { updated_at: null, goals: [] };
state.recordsByMonth = state.recordsByMonth || {};
renderAll();
syncGist();
fetchTodoWidget();
</script>
